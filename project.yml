name: Citra
options:
  bundleIdPrefix: com.chasonick
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
# Signing lives in Config/Base.xcconfig (ad-hoc) with an optional, git-ignored local override.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  Citra:
    type: application
    platform: macOS
    sources: [Citra]
    info:
      path: Citra/Info.plist
      properties:
        CFBundleDisplayName: Citra
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "2"
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chasonick.Citra
      configs:
        # Release only: hosted Debug tests need library validation off.
        Release:
          ENABLE_HARDENED_RUNTIME: YES
  CitraTests:
    type: bundle.unit-test
    platform: macOS
    sources: [CitraTests]
    dependencies:
      - target: Citra
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Citra:
    build:
      targets:
        Citra: all
        CitraTests: [test]
    test:
      targets: [CitraTests]
      # Pin settings the suite depends on, so a user's preferences never redirect test output.
      commandLineArguments:
        "-outputLocation original": true
        "-videoQuality passthrough": true
        "-ringSize normal": true
        "-motion normal": true
